name: Build Apps

on:
  push:
    branches: [ main ]

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate Android folder
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r assets /tmp/assets_backup
          rm -rf android
          flutter create --org com.msstore --project-name ms_store_oman .
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf assets
          cp -r /tmp/assets_backup assets
          mkdir -p assets/images
          flutter pub get

      - name: Pin classic Gradle DSL (AGP 9 compatibility)
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MS Store"/' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Restore persisted release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ms-store.jks

      - name: Write build.gradle (SDK 36 + release signing)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "Detected Kotlin DSL (build.gradle.kts)"
            rm -f android/app/build.gradle
            cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.msstore.ms_store_oman"
              compileSdk = 36

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.msstore.ms_store_oman"
                  minSdk = 21
                  targetSdk = 36
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                      storeFile = file("ms-store.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          else
            echo "Detected Groovy DSL (build.gradle)"
            rm -f android/app/build.gradle.kts
            cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.msstore.ms_store_oman"
              compileSdk 36

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.msstore.ms_store_oman"
                  minSdk 21
                  targetSdk 36
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }

              signingConfigs {
                  release {
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                      storeFile file("ms-store.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ms-store-oman.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ms-store-oman.aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate iOS folder
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r assets /tmp/assets_backup
          rm -rf ios android
          flutter create --org com.msstore --project-name ms_store_oman .
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf assets
          cp -r /tmp/assets_backup assets
          mkdir -p assets/images
          flutter pub get

      - name: Set iOS app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MS Store" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MS Store" ios/Runner/Info.plist

      - name: Set iOS minimum version
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/' ios/Runner.xcodeproj/project.pbxproj

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ms-store-oman.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ms-store-oman.ipa
          path: build/ios/ipa/ms-store-oman.ipa
