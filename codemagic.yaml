workflows:
  android-workflow:
    name: MS Store Oman - Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Save Dart files
        script: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml

      - name: Regenerate Android folder
        script: |
          rm -rf android
          flutter create --org com.msstore --project-name ms_store_oman .

      - name: Restore your code
        script: |
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Get dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
