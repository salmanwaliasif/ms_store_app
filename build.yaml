name: Build Apps

on:
  push:
    branches: [ main ]

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate Android folder
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r assets /tmp/assets_backup
          rm -rf android
          flutter create --org com.msstore --project-name ms_store_oman .
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf assets
          cp -r /tmp/assets_backup assets
          mkdir -p assets/images
          flutter pub get

      - name: Fix AndroidManifest permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MS Store"/' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Restore persisted release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ms-store.jks

      - name: Inject signing config + SDK 36
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          content = open('android/app/build.gradle').read()

          signing = f"""
              signingConfigs {{
                  release {{
                      storeFile file("ms-store.jks")
                      storePassword "{os.environ['KEYSTORE_PASSWORD']}"
                      keyAlias "{os.environ['KEY_ALIAS']}"
                      keyPassword "{os.environ['KEY_PASSWORD']}"
                  }}
              }}
          """

          content = content.replace(
              'buildTypes {',
              signing + '\n    buildTypes {'
          ).replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release'
          )

          content = re.sub(r'compileSdk \d+', 'compileSdk 36', content)
          content = re.sub(r'compileSdkVersion \d+', 'compileSdkVersion 36', content)
          content = re.sub(r'targetSdk \d+', 'targetSdk 36', content)
          content = re.sub(r'targetSdkVersion \d+', 'targetSdkVersion 36', content)
          content = re.sub(r'minSdk \d+', 'minSdk 21', content)
          content = re.sub(r'minSdkVersion \d+', 'minSdkVersion 21', content)
          content = re.sub(r'minSdk flutter\.minSdkVersion', 'minSdk 21', content)
          content = re.sub(r'minSdkVersion flutter\.minSdkVersion', 'minSdkVersion 21', content)

          open('android/app/build.gradle', 'w').write(content)
          PYEOF

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ms-store-oman.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ms-store-oman.aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate iOS folder
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r assets /tmp/assets_backup
          rm -rf ios android
          flutter create --org com.msstore --project-name ms_store_oman .
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf assets
          cp -r /tmp/assets_backup assets
          mkdir -p assets/images
          flutter pub get

      - name: Set iOS app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MS Store" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MS Store" ios/Runner/Info.plist

      - name: Set iOS minimum version
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/' ios/Runner.xcodeproj/project.pbxproj

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ms-store-oman.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ms-store-oman.ipa
          path: build/ios/ipa/ms-store-oman.ipa
